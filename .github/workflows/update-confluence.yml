name: Update SCALP-Ω Live Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live SCALP-Ω analysis
        env:
          ENDPOINT: https://scalp-omega-ai-webhook.vercel.app/api/analyze
        run: |
          curl --fail --silent --show-error --max-time 60 "$ENDPOINT" -o CONFLUENCE_RESULT.txt
          test -s CONFLUENCE_RESULT.txt

      - name: Commit latest analysis
        run: |
          git config user.name "SCALP-Ω Bot"
          git config user.email "actions@github.com"
          git add CONFLUENCE_RESULT.txt
          if git diff --cached --quiet; then
            echo "No analysis change."
          else
            git commit -m "chore: update live SCALP-Ω analysis"
            git push
          fi
