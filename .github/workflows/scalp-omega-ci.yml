name: SCALP-Omega CI

on:
  push:
    branches:
      - main
      - institutional-23-engine
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find api lib -type f -name '*.js' -print0)

      - name: Core module smoke test
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { analyzeDerivatives } from './lib/derivatives-engine.js';
          import { buildEventRisk } from './lib/event-risk-engine.js';
          import { calibrateProbability } from './lib/calibration-engine.js';
          import { buildWalkForwardWindows } from './lib/walkforward-engine.js';
          import { buildExecutionPlan } from './lib/execution-plan-engine.js';
          import { buildAdaptiveRisk } from './lib/adaptive-risk-engine.js';
          import { classifyRegime } from './lib/regime-engine.js';
          import { findHistoricalAnalogs } from './lib/historical-analog-engine.js';

          const derivatives = analyzeDerivatives({
            openInterest: { oi: 110 },
            fundingRate: 0.0001,
            fundingTime: Date.now() - 5 * 60 * 1000,
            nextFundingTime: Date.now() + 55 * 60 * 1000,
            oiHistory: [
              { ts: 1, oi: 100 },
              { ts: 2, oi: 105 },
              { ts: 3, oi: 110 }
            ],
            fundingHistory: [
              { ts: 1, fundingRate: 0.00001 },
              { ts: 2, fundingRate: 0.00002 },
              { ts: 3, fundingRate: 0.00001 },
              { ts: 4, fundingRate: 0.00003 },
              { ts: 5, fundingRate: 0.00002 },
              { ts: 6, fundingRate: 0.00004 },
              { ts: 7, fundingRate: 0.00003 },
              { ts: 8, fundingRate: 0.00005 }
            ],
            takerVolumeHistory: [{ ts: 1, buyVol: 12, sellVol: 8 }],
            longShortHistory: [{ ts: 1, longShortRatio: 1.1 }]
          });
          assert.equal(derivatives.available, true);
          assert.equal(derivatives.openInterest.change, 10);

          const eventRisk = buildEventRisk({
            timestamp: Date.now(),
            funding: {
              fundingTime: Date.now() - 5 * 60 * 1000,
              nextFundingTime: Date.now() + 55 * 60 * 1000
            }
          });
          assert.equal(eventRisk.riskLevel, 'MEDIUM');
          assert.equal(eventRisk.flags.includes('FUNDING_WINDOW'), true);

          const calibration = calibrateProbability([
            { p: 0.6, y: 1 },
            { p: 0.4, y: 0 }
          ]);
          assert.equal(calibration.ready, false);
          assert.equal(calibration.sampleSize, 2);

          assert.equal(buildWalkForwardWindows(1200, { trainBars: 800, testBars: 200, step: 200 }).length, 2);
          const candles=Array.from({length:240},(_,i)=>({open:100+i*.1,high:101+i*.1,low:99+i*.1,close:100+i*.1,volume:1000,confirmed:true}));
          const regime=classifyRegime(candles); assert.equal(typeof regime.regime,'string');
          const risk=buildAdaptiveRisk({entry:124,direction:'LONG',atr:1,structure:{protectedLow:122,latestSwingLow:{price:122}},liquidity:{nearestAbove:{price:128}},regime});
          assert.equal(risk.targets.length,3);
          const plan=buildExecutionPlan({decision:'LONG',setup:{type:'TREND_PULLBACK',trigger:'FRESH_BULLISH_ZONE_REJECTION'},risk,probability:{probability:.76,uncertainty:.08},marketPrice:124,liquidity:{nearestBelow:{price:122}},regime});
          assert.equal(['MARKET','LIMIT','STOP'].includes(plan.entryMode),true);
          assert.equal(plan.targets.length,3);
          assert.equal(findHistoricalAnalogs({trend:'UPTREND'},[]).available,false);
          console.log('SCALP-Omega core smoke test: PASS');
          NODE

      - name: Live OKX integration smoke test
        run: node scripts/integration-smoke.mjs
        timeout-minutes: 4
